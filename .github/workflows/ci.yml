name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:packages
      - name: Check the ui catalog is up to date
        run: |
          pnpm generate:catalog
          git diff --exit-code .claude/skills/ui-catalog/CATALOG.md packages/ui/src/gallery/props-data.ts
