name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:packages
      # `tsc` leaves the stylesheets behind (`packages/ui/scripts/copy-css.ts` copies them): a package published without them cannot be built against.
      - name: Check the built ui carries its stylesheets
        run: |
          test -f packages/ui/dist/icon.module.css
          test -f packages/ui/dist/style/base.css
      - name: Check the ui catalog is up to date
        run: |
          pnpm generate:catalog
          git diff --exit-code .claude/skills/ui-catalog/CATALOG.md packages/ui/src/gallery/props-data.ts
