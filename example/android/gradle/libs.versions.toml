[versions]
agp = "8.7.3"
kotlin = "2.0.21"
# The version of dev.hashsome:* to use. With the composite build above it only names the dependency; a consumer that
# resolves from GitHub Packages gets exactly this version, and `hashsome upgrade` rewrites it.
hashsome = "0.19.2"

[libraries]
hashsome-ui = { module = "dev.hashsome:ui", version.ref = "hashsome" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
